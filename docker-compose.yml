services:
  database:
    image: postgres:14
    environment:
      POSTGRES_DB: conjur
      POSTGRES_USER: conjur
      POSTGRES_PASSWORD: ${CONJUR_DB_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conjur"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - database_data:/var/lib/postgresql/data
    networks:
      - conjur

  conjur:
    image: cyberark/conjur:latest
    command: server
    environment:
      OPENSSL_FIPS: "0"
      DATABASE_URL: postgres://conjur:${CONJUR_DB_PASSWORD}@database/conjur
      CONJUR_DATA_KEY: ${CONJUR_DATA_KEY}
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:80"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      database:
        condition: service_healthy
    networks:
      - conjur
    volumes:
      - ./policy:/policy

  ca-signer:
    build:
      context: ./workloads
      dockerfile: ca-signer/Dockerfile
    environment:
      CA_CERT_PATH: /ca/ca.crt
      CA_KEY_PATH: /ca/ca.key
      LISTEN_PORT: 8000
    volumes:
      - ./certs:/ca:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "--cacert", "/ca/ca.crt", "-f", "https://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - conjur
    depends_on:
      - conjur

  workload-a:
    build:
      context: ./workloads
      dockerfile: mtls-client/Dockerfile
    environment:
      CONJUR_APPLIANCE_URL: http://conjur:80
      CONJUR_ACCOUNT: demo
      CONJUR_AUTHN_LOGIN: host/demo/workload-a
      CONJUR_AUTHN_API_KEY: ${WORKLOAD_A_API_KEY}
      CA_SIGNER_URL: https://ca-signer:8000
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    depends_on:
      conjur:
        condition: service_healthy
      ca-signer:
        condition: service_started
      workload-b:
        condition: service_started
    networks:
      - conjur
    volumes:
      - ./certs/ca.crt:/ca/ca.crt:ro
      - workload_a_certs:/certs

  workload-b:
    build:
      context: ./workloads
      dockerfile: mtls-server/Dockerfile
    environment:
      CONJUR_APPLIANCE_URL: http://conjur:80
      CONJUR_ACCOUNT: demo
      CONJUR_AUTHN_LOGIN: host/demo/workload-b
      CONJUR_AUTHN_API_KEY: ${WORKLOAD_B_API_KEY}
      CA_SIGNER_URL: https://ca-signer:8000
    ports:
      - "8443:8443"
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
    depends_on:
      conjur:
        condition: service_healthy
      ca-signer:
        condition: service_started
    networks:
      - conjur
    volumes:
      - ./certs/ca.crt:/ca/ca.crt:ro
      - workload_b_certs:/certs

  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - conjur

  dashboard:
    build:
      context: ./dashboard
    ports:
      - "5001:5000"
    environment:
      DOCKER_HOST: tcp://dockerproxy:2375
    volumes:
      - workload_a_certs:/workload_a_certs
      - workload_b_certs:/workload_b_certs
      - ./certs/ca.crt:/certs/ca.crt:ro
    depends_on:
      - workload-a
      - workload-b
      - dockerproxy
    networks:
      - conjur

networks:
  conjur:

volumes:
  database_data:
  workload_a_certs:
  workload_b_certs:
