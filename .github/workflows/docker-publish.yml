name: Publish Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # 1. Build and push Demo Orchestrator (Root)
      - name: Build and push Demo Orchestrator Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conjur-demo:latest
            ghcr.io/${{ github.repository_owner }}/conjur-demo:${{ github.sha }}
            ${{ env.REGISTRY_OWNER }}/conjur-demo:latest
            ${{ env.REGISTRY_OWNER }}/conjur-demo:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build and push ca-signer
      - name: Build and push CA Signer
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./workloads
          file: ./workloads/ca-signer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conjur-demo-ca-signer:latest
            ghcr.io/${{ github.repository_owner }}/conjur-demo-ca-signer:${{ github.sha }}
            ${{ env.REGISTRY_OWNER }}/conjur-demo-ca-signer:latest
            ${{ env.REGISTRY_OWNER }}/conjur-demo-ca-signer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build and push workload-a (mtls-client)
      - name: Build and push Workload A (Client)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./workloads
          file: ./workloads/mtls-client/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conjur-demo-workload-a:latest
            ghcr.io/${{ github.repository_owner }}/conjur-demo-workload-a:${{ github.sha }}
            ${{ env.REGISTRY_OWNER }}/conjur-demo-workload-a:latest
            ${{ env.REGISTRY_OWNER }}/conjur-demo-workload-a:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Build and push workload-b (mtls-server)
      - name: Build and push Workload B (Server)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./workloads
          file: ./workloads/mtls-server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conjur-demo-workload-b:latest
            ghcr.io/${{ github.repository_owner }}/conjur-demo-workload-b:${{ github.sha }}
            ${{ env.REGISTRY_OWNER }}/conjur-demo-workload-b:latest
            ${{ env.REGISTRY_OWNER }}/conjur-demo-workload-b:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. Build and push dashboard
      - name: Build and push Dashboard
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/conjur-demo-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/conjur-demo-dashboard:${{ github.sha }}
            ${{ env.REGISTRY_OWNER }}/conjur-demo-dashboard:latest
            ${{ env.REGISTRY_OWNER }}/conjur-demo-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
