name: Publish Docker Images

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_OWNER: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 1. Build and push ca-signer
      - name: Build and push CA Signer
        uses: docker/build-push-action@v7
        with:
          context: ./workloads
          file: ./workloads/ca-signer/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_OWNER }}/conjur-demo-ca-signer:latest
            ${{ env.REGISTRY_OWNER }}/conjur-demo-ca-signer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build and push workload-a (mtls-client)
      - name: Build and push Workload A (Client)
        uses: docker/build-push-action@v7
        with:
          context: ./workloads
          file: ./workloads/mtls-client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_OWNER }}/conjur-demo-workload-a:latest
            ${{ env.REGISTRY_OWNER }}/conjur-demo-workload-a:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build and push workload-b (mtls-server)
      - name: Build and push Workload B (Server)
        uses: docker/build-push-action@v7
        with:
          context: ./workloads
          file: ./workloads/mtls-server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_OWNER }}/conjur-demo-workload-b:latest
            ${{ env.REGISTRY_OWNER }}/conjur-demo-workload-b:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Build and push dashboard
      - name: Build and push Dashboard
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard
          file: ./dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_OWNER }}/conjur-demo-dashboard:latest
            ${{ env.REGISTRY_OWNER }}/conjur-demo-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
