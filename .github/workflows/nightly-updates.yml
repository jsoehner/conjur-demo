name: Nightly Dependency Updates

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Update Python dependencies
        run: |
          pip install pur
          pur -r dashboard/requirements.txt

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No dependency updates found."
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Dependency updates found. Proceeding with verification..."
          fi

      # Only run verification and PR creation if there are changes
      - name: Set up Docker Buildx
        if: steps.check_changes.outputs.changes == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and Start Stack for Verification
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          # Clean up any potential artifacts
          rm -rf certs/*
          # Run initialization script (this builds and starts the containers)
          bash init.sh
          
      - name: Verify mTLS Functionality
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          echo "Waiting for workloads to start up and establish mTLS connection..."
          SUCCESS=false
          for i in {1..18}; do
            CLIENT_LOGS=$(docker compose logs workload-a 2>&1 || true)
            if echo "$CLIENT_LOGS" | grep -q "mTLS connection successful"; then
              echo "Verification Succeeded after $((i * 5)) seconds!"
              SUCCESS=true
              break
            fi
            echo "Waiting for mTLS connection... ($((i * 5))s)"
            sleep 5
          done

          echo "=== Workload A (Client) Logs ==="
          echo "$CLIENT_LOGS"
          echo "================================="
          echo "=== CA Signer Logs ==="
          docker compose logs ca-signer 2>&1 || true
          echo "======================"
          echo "=== Workload B (Server) Logs ==="
          docker compose logs workload-b 2>&1 || true
          echo "================================"

          if [ "$SUCCESS" = "true" ]; then
            echo "Verification Succeeded: mTLS connection was established successfully!"
          else
            echo "Verification Failed: mTLS connection was not established within 90 seconds."
            exit 1
          fi

      - name: Tear Down Stack
        if: always() && steps.check_changes.outputs.changes == 'true'
        run: |
          docker compose down -v || true
          rm -f .env

      - name: Create Pull Request
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): nightly dependency updates"
          branch: nightly-deps-update
          delete-branch: true
          title: "chore(deps): nightly dependency updates"
          body: |
            This automated PR updates the Python dependencies in `dashboard/requirements.txt` to their latest versions.
            
            **Verification Results**:
            - Pinned dependencies upgraded using `pur`.
            - Built and ran the entire Conjur demo stack on the runner.
            - Verified that `workload-a` (Client) successfully established a mutual TLS (mTLS) connection with `workload-b` (Server).
          labels: |
            dependencies
            automated-pr
